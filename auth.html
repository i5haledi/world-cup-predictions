<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الدخول | توقعات كأس العالم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <main class="portal-shell auth-layout">
      <section class="auth-intro">
        <span class="portal-brand">توقعات كأس العالم 2026</span>
        <h1>توقع، نافس،<br /><span>وتصدر الترتيب.</span></h1>
        <p>أنشئ حساباً بسيطاً ليتم حفظ توقعاتك واحتساب نقاطك تلقائياً في كل جولة.</p>
      </section>

      <section class="panel auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" type="button" data-mode="login">تسجيل الدخول</button>
          <button class="auth-tab" type="button" data-mode="register">إنشاء حساب</button>
        </div>
        <form id="auth-form">
          <div class="form-field">
            <label for="username">اسم المستخدم</label>
            <input id="username" name="username" maxlength="30" autocomplete="username" required />
          </div>
          <div class="form-field">
            <label for="password">كلمة المرور</label>
            <input id="password" name="password" type="password" minlength="4" maxlength="72" autocomplete="current-password" required />
          </div>
          <button id="auth-submit" class="primary-button" type="submit">دخول</button>
          <div id="auth-message" class="form-message" role="status"></div>
        </form>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
