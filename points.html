<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل نقاطي | توقعات كأس العالم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <main class="portal-shell">
      <nav class="portal-nav">
        <a class="portal-brand" href="/">توقعات كأس العالم 2026</a>
        <div class="nav-links">
          <a class="nav-link" href="/">التوقعات</a>
          <a class="nav-link" href="/leaderboard.html">الترتيب</a>
          <a class="nav-link active" href="/points.html">نقاطي</a>
          <a id="admin-link" class="nav-link" href="/admin.html" hidden>الآدمن</a>
          <button id="logout-button" class="logout-button" type="button">خروج</button>
        </div>
      </nav>

      <header class="page-heading points-heading-page">
        <span>تفاصيل الأداء</span>
        <h1>نقاطي</h1>
        <p>راجع توقعاتك لكل مباراة، النتيجة الفعلية، والنقاط التي حصلت عليها.</p>
      </header>

      <section class="points-summary panel">
        <div>
          <span>إجمالي النقاط</span>
          <strong id="total-points">0</strong>
        </div>
        <div>
          <span>المستخدم</span>
          <strong id="points-username">...</strong>
        </div>
      </section>

      <div id="round-filters" class="round-filters" aria-label="فلترة الجولات"></div>
      <section id="points-body" class="points-details">
        <div class="loading">جاري تحميل تفاصيل النقاط...</div>
      </section>
    </main>
    <script src="points.js"></script>
  </body>
</html>
