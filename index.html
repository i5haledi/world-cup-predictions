<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="توقع نتائج مباريات كأس العالم وشارك اختياراتك مع أصدقائك."
    />
    <title>توقعات كأس العالم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow-one"></div>
    <div class="page-glow page-glow-two"></div>

    <main>
      <section class="rules" aria-label="نظام النقاط">
        <div class="rule">
          <strong><span>1</span> نقطة</strong>
          <span>توقع المنتخب الفائز أو التعادل بشكل صحيح</span>
        </div>
        <div class="rule">
          <strong><span>3</span> نقاط</strong>
          <span>توقع النتيجة رقمياً بشكل صحيح</span>
        </div>
      </section>

      <section class="predictions" aria-labelledby="matches-title">
        <div class="section-heading">
          <div>
            <span id="round-kicker" class="section-kicker">كأس العالم 2026</span>
            <h1 id="matches-title"><span id="round-name"></span></h1>
          </div>
          <div class="progress-copy">
            <strong id="progress-count">0 / 0</strong>
            <span>تم اختيارها</span>
          </div>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="تقدم التوقعات"
          aria-valuemin="0"
          aria-valuemax="0"
          aria-valuenow="0"
        >
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="matches-list" class="matches-list"></div>
      </section>

      <section class="player-field">
        <label for="player-name">الاسم</label>
        <div class="name-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm-7 18a7 7 0 0 1 14 0"/>
          </svg>
          <input
            id="player-name"
            name="player-name"
            type="text"
            maxlength="30"
            autocomplete="name"
            placeholder="اكتب اسمك قبل الإرسال"
          />
        </div>
      </section>

      <section class="submit-panel">
        <div class="submit-copy">
          <span class="submit-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
          </span>
          <div>
            <strong id="submit-title">جاري تحميل المباريات</strong>
            <span id="submit-hint">يتم حفظ اختياراتك تلقائياً.</span>
          </div>
        </div>
        <button id="submit-button" class="submit-button" type="button" disabled>
          <span id="submit-label">إرسال التوقعات</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>
      </section>
    </main>

    <dialog id="result-dialog">
      <div class="dialog-content">
        <button id="close-dialog" class="close-button" type="button" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="success-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
        </div>
        <span class="section-kicker">اكتملت التوقعات</span>
        <h2>صورة التوقعات جاهزة</h2>
        <p>شارك الصورة مباشرة في مجموعة الأصدقاء.</p>
        <div class="share-preview">
          <img id="share-image" alt="صورة توقعات المباريات" />
        </div>
        <div class="dialog-actions">
          <button id="share-button" class="submit-button" type="button">
            مشاركة الصورة
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5m0-5-9 9M5 8v11h11"/></svg>
          </button>
          <button id="download-button" class="secondary-button" type="button">
            تنزيل الصورة
          </button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
