<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الترتيب | توقعات كأس العالم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <main class="portal-shell">
      <nav class="portal-nav">
        <a class="portal-brand" href="/">توقعات كأس العالم 2026</a>
        <div class="nav-links">
          <a class="nav-link" href="/">التوقعات</a>
          <a class="nav-link active" href="/leaderboard.html">الترتيب</a>
          <a id="admin-link" class="nav-link" href="/admin.html" hidden>الآدمن</a>
          <button id="logout-button" class="logout-button" type="button">خروج</button>
        </div>
      </nav>
      <header class="page-heading">
        <span>المنافسة العامة</span>
        <h1>ترتيب النقاط</h1>
        <p>يتم احتساب النتائج الصحيحة تلقائياً، وتحديث الترتيب عند اكتمال المباريات.</p>
      </header>
      <section class="panel leaderboard">
        <div class="leaderboard-head">
          <span>المركز</span>
          <span>المستخدم</span>
          <span class="points-heading">النقاط</span>
        </div>
        <div id="leaderboard-body" class="loading">جاري تحميل الترتيب...</div>
      </section>
      <section class="powered-by" aria-label="الشركات الراعية">
        <p>Powered by</p>
        <div class="sponsor-logos">
          <img src="/Powered%20by/almarai.png" alt="Almarai" />
          <img src="/Powered%20by/Alrabie.png" alt="Alrabie" />
          <img src="/Powered%20by/Kraft.png" alt="Kraft" />
          <img src="/Powered%20by/Lays.png" alt="Lays" />
          <img src="/Powered%20by/Mirinda.png" alt="Mirinda" />
          <img src="/Powered%20by/Pepsi.svg" alt="Pepsi" />
          <img src="/Powered%20by/SADAFCO.png" alt="SADAFCO" />
          <img src="/Powered%20by/Tide.png" alt="Tide" />
          <img src="/Powered%20by/WadiFatima.png" alt="Wadi Fatima" />
        </div>
      </section>
    </main>
    <script src="leaderboard.js"></script>
  </body>
</html>
